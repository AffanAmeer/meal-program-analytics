name: Check figures

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rebuild every output from the raw data
        run: python scripts/run_all.py
      - name: Outputs in the repo match a fresh rebuild
        run: git diff --exit-code -- data/
      - name: Headline figures
        run: python -m pytest -q tests/
